<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" role="img" aria-labelledby="hero-title">
  <title id="hero-title">Stylised quantum circuit diagram</title>

  <!-- qubit wires -->
  <line x1="20" y1="30" x2="620" y2="30" stroke="#002957" stroke-width="2"/>
  <line x1="20" y1="60" x2="620" y2="60" stroke="#002957" stroke-width="2"/>
  <line x1="20" y1="90" x2="620" y2="90" stroke="#002957" stroke-width="2"/>

  <!-- gate: Hadamard on wire 1 -->
  <rect x="70" y="12" width="36" height="36" rx="4" fill="#ffffff" stroke="#002957" stroke-width="2"/>
  <text x="88" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#002957">H</text>

  <!-- control dot + target for CNOT between wire 1 and wire 2 -->
  <circle cx="180" cy="30" r="6" fill="#002957"/>
  <line x1="180" y1="30" x2="180" y2="60" stroke="#002957" stroke-width="2"/>
  <circle cx="180" cy="60" r="12" fill="none" stroke="#bb501e" stroke-width="3"/>
  <line x1="172" y1="60" x2="188" y2="60" stroke="#bb501e" stroke-width="3"/>
  <line x1="180" y1="52" x2="180" y2="68" stroke="#bb501e" stroke-width="3"/>

  <!-- gate on wire 3 -->
  <rect x="250" y="72" width="36" height="36" rx="4" fill="#ffffff" stroke="#c29a5b" stroke-width="2"/>
  <text x="268" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#c29a5b">R</text>

  <!-- control dot + target for CNOT between wire 2 and wire 3 -->
  <circle cx="360" cy="60" r="6" fill="#002957"/>
  <line x1="360" y1="60" x2="360" y2="90" stroke="#002957" stroke-width="2"/>
  <circle cx="360" cy="90" r="12" fill="none" stroke="#bb501e" stroke-width="3"/>
  <line x1="352" y1="90" x2="368" y2="90" stroke="#bb501e" stroke-width="3"/>
  <line x1="360" y1="82" x2="360" y2="98" stroke="#bb501e" stroke-width="3"/>

  <!-- measurement gates -->
  <g transform="translate(440,12)">
    <rect width="36" height="36" rx="4" fill="#f1e9dc" stroke="#002957" stroke-width="2"/>
    <path d="M6 26 A12 12 0 0 1 30 26" fill="none" stroke="#002957" stroke-width="2"/>
    <line x1="18" y1="26" x2="26" y2="12" stroke="#002957" stroke-width="2"/>
  </g>
  <g transform="translate(440,42)">
    <rect width="36" height="36" rx="4" fill="#f1e9dc" stroke="#002957" stroke-width="2"/>
    <path d="M6 26 A12 12 0 0 1 30 26" fill="none" stroke="#002957" stroke-width="2"/>
    <line x1="18" y1="26" x2="26" y2="12" stroke="#002957" stroke-width="2"/>
  </g>
  <g transform="translate(440,72)">
    <rect width="36" height="36" rx="4" fill="#f1e9dc" stroke="#002957" stroke-width="2"/>
    <path d="M6 26 A12 12 0 0 1 30 26" fill="none" stroke="#002957" stroke-width="2"/>
    <line x1="18" y1="26" x2="26" y2="12" stroke="#002957" stroke-width="2"/>
  </g>

  <!-- results readout -->
  <text x="620" y="35" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" fill="#234923">01</text>
  <text x="620" y="65" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" fill="#234923">10</text>
  <text x="620" y="95" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" fill="#234923">11</text>
</svg>
